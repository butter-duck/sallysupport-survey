    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F4F7FA; }
      #root { min-height: 100vh; }
      input, select, button, textarea { font-family: inherit; }
      .partner-fade { filter: grayscale(100%); opacity: .62; transition: filter .2s ease, opacity .2s ease; }
      .partner-link:hover .partner-fade { filter: none; opacity: 1; }
      /* Seven partners need ~1040px to sit on one line. */
      .partner-strip { display: flex; flex-wrap: wrap; align-items: center;
        justify-content: center; gap: 28px; max-width: 1100px; margin: 0 auto; }
      /* Below that, free wrapping strands the seventh logo alone on a second
         line, which reads as though it were singled out. Pinning each item to
         a quarter of the row forces a balanced 4 + 3; justify-content keeps
         the short trailing row centred, which a grid would not. */
      @media (max-width: 1120px) {
        .partner-strip { gap: 22px 16px; max-width: 620px; }
        .partner-strip > a { flex: 0 0 calc(25% - 12px); }
      }
      @media (max-width: 560px) {
        .partner-strip { gap: 18px 10px; }
        .partner-strip > a { flex: 0 0 calc(25% - 7.5px); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
