<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Admin Roadmap Report by SallySupport</title>
    <meta name="description" content="A live industry benchmark on how home care agencies hire, staff, and grow their office teams." />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- ?v= on the image URL is a cache-buster. LinkedIn, Facebook and Slack
         cache a scraped image for days against its exact URL, so a redeploy
         alone will not dislodge a stale copy — bump this whenever the card art
         changes, and re-scrape the page in LinkedIn's Post Inspector. -->
    <meta property="og:title" content="The Admin Roadmap Report by SallySupport" />
    <meta property="og:description" content="A live industry benchmark on how home care agencies hire, staff, and grow their office teams." />
    <meta property="og:image" content="https://sallysupport-survey.vercel.app/og-image.png?v=3" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://sallysupport-survey.vercel.app/" />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Admin Roadmap Report by SallySupport" />
    <meta name="twitter:description" content="A live industry benchmark on how home care agencies hire, staff, and grow their office teams." />
    <meta name="twitter:image" content="https://sallysupport-survey.vercel.app/og-image.png?v=3" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #F4F7FA; }
      #root { min-height: 100vh; }
      input, select, button, textarea { font-family: inherit; }
      .partner-fade { filter: grayscale(100%); opacity: .62; transition: filter .2s ease, opacity .2s ease; }
      .partner-link:hover .partner-fade { filter: none; opacity: 1; }
      /* Nine partners are too wide for one line, and free wrapping strands a
         logo alone on the last row, which reads as though it were singled
         out. Pinning each item to a fixed share of the row forces balanced
         rows: 5 + 4 on desktop, 3 + 3 + 3 below. justify-content keeps a short
         trailing row centred, which a grid would not. Revisit the fractions
         when the partner count changes. */
      .partner-strip { display: flex; flex-wrap: wrap; align-items: center;
        justify-content: center; gap: 24px 28px; max-width: 1100px; margin: 0 auto; }
      .partner-strip > a { flex: 0 0 calc(20% - 22.4px); }
      @media (max-width: 1120px) {
        .partner-strip { gap: 22px 16px; max-width: 620px; }
        .partner-strip > a { flex: 0 0 calc(33.333% - 10.667px); }
      }
      @media (max-width: 560px) {
        .partner-strip { gap: 18px 10px; }
        .partner-strip > a { flex: 0 0 calc(33.333% - 6.667px); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
